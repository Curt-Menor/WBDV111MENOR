<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borgz' Billiard Hall | General View</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="general">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <div class="brand-mark"><img src="logo.png" alt="Borgz' Billiard Hall logo"></div>
        <div>
          <strong>BORGZ' BILLIARD HALL</strong>
          <span>General View</span>
        </div>
      </div>
      <nav class="nav">
        <a href="about.html">About Us</a>
        <button data-action="logout">Logout</button>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <section class="page-title">
      <h1>General View</h1>
      <p>A public overview of the billiard hall, available tables, and current announcements.</p>
    </section>

    <section class="section">
      <div class="stat-grid" id="stats"></div>
    </section>

    <section class="section grid-2">
      <div class="panel">
        <div class="section-head">
          <div>
            <h2>How It Works</h2>
            <p>Simple steps for customers and visitors.</p>
          </div>
        </div>
        <div class="grid-3" id="generalFeatures"></div>
      </div>

      <div class="panel">
        <div class="section-head">
          <div>
            <h2>Current Announcements</h2>
            <p>Important updates from the hall.</p>
          </div>
        </div>
        <div id="generalAnnouncements" class="list"></div>
      </div>
    </section>

    <section class="section grid-2">
      <div class="panel">
        <div class="section-head">
          <div>
            <h2>Available Tables</h2>
            <p>Filter by table type.</p>
          </div>
        </div>
        <label>Table Type</label>
        <select id="generalTableType">
          <option value="">All</option>
          <option>Standard</option>
          <option>Professional</option>
          <option>VIP</option>
        </select>
        <div class="hr"></div>
        <div id="generalAvailable" class="list"></div>
      </div>

      <div class="panel">
        <div class="logo-hero">
          <img src="logo.png" alt="Borgz' Billiard Hall logo">
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
